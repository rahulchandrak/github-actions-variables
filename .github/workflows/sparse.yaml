name: Sparse Checkout Example

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  sparse-checkout:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Sparse checkout options
        path: .
        


    - name: Perform your actions
      run: |
        # Your commands here, e.g., running tests, building, etc.
        echo "Current directory:"
        pwd
        
        echo "Listing sparse checked out files:"
        ls -R

    - name: Upload artifacts
      uses: actions/upload-artifact@v4  # Use v3 for GHES compatibility
      with:
        name: my-artifact
        path: folder1/file1.txt