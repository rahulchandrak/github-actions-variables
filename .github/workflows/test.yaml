name: Hello-world
on: 
  push

jobs:
  hello-world-job:
    runs-on: ubuntu-latest
    steps:
    - name: get instance metadata
      run: uname -a
    - name: who is the current user
      run: whoami
    - name: where am I
      run: pwd
    - name: list all files
      run: ls -lrt
    - name: run multi commands on linux
      run: |
        uname -a
        whoami
        df -h
        uptime
        free -m
    - name: checkout the repo
      run: |
        git clone https://github.com/rahulchandrak/github-actions-variables.git

    
