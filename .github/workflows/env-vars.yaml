name: Manual Trigger with Inputs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to deploy to'
        required: true
        default: 'staging'
      release_version:
        description: 'Version number for release'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to the specified environment
        run: echo "Deploying to ${{ github.event.inputs.environment }} with version ${{ github.event.inputs.release_version }}"