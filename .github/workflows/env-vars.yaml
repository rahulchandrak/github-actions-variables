name: Workflow Dispatch with Choices

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select an environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to the selected environment
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }} environment."

